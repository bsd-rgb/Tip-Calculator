<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <header>
      <h1><span>SPLI</span><br /><span>TTER</span></h1>
    </header>
    <main>
      <section class="calculator">
        <div class="container">
          <!-- FORM START HERE (?) -->
          <div class="amount">
            <label for="bill-amount">Bill</label>
            <input id="bill-amount" />
          </div>
          <div class="tip__container">
            <fieldset>
              <legend>Select Tip %</legend>
              <div>
                <input type="radio" id="5" name="fivePercent" value="5" />
                <label for="5">5%</label>
              </div>
              <div>
                <input type="radio" id="10" name="tenPercent" value="10" />
                <label for="10">10%</label>
              </div>
              <div>
                <input type="radio" id="20" name="twentyPercent" value="20" />
                <label for="20">20%</label>
              </div>
              <div>
                <input
                  type="radio"
                  id="25"
                  name="twentyfivePercent"
                  value="25"
                />
                <label for="25">25%</label>
              </div>
              <div>
                <input type="radio" id="50" name="fiftyPercent" value="50" />
                <label for="50">50%</label>
              </div>
              <div>
                <input
                  type="radio"
                  id="custom"
                  name="customPercent"
                  value="custom"
                />
                <label for="custom">Custom</label>
              </div>
            </fieldset>
          </div>
          <div class="num__people">
            <label for="num-people">Number of People</label>
            <input id="num-people" />
          </div>

          <div class="tip__summary">
            <div class="tip__summary__amount">
              <p>
                Tip Amount<span><br />/ person</span>
              </p>
              <p class="tip__amount">$4.27</p>
            </div>
            <div class="tip__summary__total">
              <p>
                Total<span><br />/ person</span>
              </p>
              <p class="tip__total">$4.27</p>
            </div>
            <button>Reset</button>
          </div>
        </div>
      </section>
    </main>
  </body>
  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
      >Frontend Mentor</a
    >. Coded by <a href="#">Brandi D</a>.
  </footer>
</html>
